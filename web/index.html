<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX live view</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>FX live view</h1>
      <nav id="instruments"></nav>
      <div id="status"></div>
    </header>
    <main>
      <section id="chart-col">
        <div id="chart-toolbar">
          <label><input type="checkbox" id="show-analogs" checked /> analog paths</label>
          <span id="legend"></span>
        </div>
        <div id="chart"></div>
      </section>
      <aside>
        <div class="card" id="trading"></div>
        <div class="card" id="decision"></div>
        <div class="card" id="plan"></div>
        <div class="card" id="analogs"></div>
        <div class="card" id="trades"></div>
        <div class="card" id="decisions"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
